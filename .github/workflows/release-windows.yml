name: Release Tools Media AV Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Download yt-dlp and FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          Invoke-WebRequest `
            -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" `
            -OutFile "tools\yt-dlp.exe"

          $ffmpegZip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          Invoke-WebRequest `
            -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
            -OutFile $ffmpegZip
          $ffmpegExtract = Join-Path $env:RUNNER_TEMP "ffmpeg-extract"
          Expand-Archive -Path $ffmpegZip -DestinationPath $ffmpegExtract -Force
          $bin = Get-ChildItem $ffmpegExtract -Directory | Select-Object -First 1
          Copy-Item (Join-Path $bin.FullName "bin\ffmpeg.exe") "tools\ffmpeg.exe"
          Copy-Item (Join-Path $bin.FullName "bin\ffprobe.exe") "tools\ffprobe.exe"

      - name: Build Windows package
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\build-full-windows.ps1

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            foreach ($oldAsset in @("media-msi.exe", "Tools-Media-AV-Setup.exe", "Tools-Media-AV-Windows.exe", "Tools-Media-AV-Windows.zip")) {
              gh release delete-asset $tag $oldAsset --yes 2>$null
            }
            gh release upload $tag `
              "release\Media-AV-Windows.zip" `
              "release\Media-AV-Windows.exe" `
              --clobber
            gh release edit $tag --title "MediaAV $tag"
          } else {
            gh release create $tag `
              "release\Media-AV-Windows.zip" `
              "release\Media-AV-Windows.exe" `
              --title "MediaAV $tag" `
              --generate-notes
          }
